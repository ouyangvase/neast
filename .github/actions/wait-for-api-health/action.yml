name: Wait for API health
description: Poll GET until the NEAST API health endpoint responds successfully
inputs:
  url:
    description: Health check URL
    required: false
    default: https://api.neast.my/health
  connect_to:
    description: >
      Optional curl --connect-to value so health can hit the ALB before
      DNS exists (e.g. api.neast.my:443:alb.amazonaws.com:443)
    required: false
    default: ""
  max_attempts:
    description: Maximum number of attempts
    required: false
    default: "60"
  interval_seconds:
    description: Seconds to wait between attempts
    required: false
    default: "10"
runs:
  using: composite
  steps:
    - name: Poll health endpoint
      shell: bash
      env:
        HEALTH_URL: ${{ inputs.url }}
        CONNECT_TO: ${{ inputs.connect_to }}
        MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        INTERVAL_SECONDS: ${{ inputs.interval_seconds }}
      run: |
        set -euo pipefail
        extra=()
        if [ -n "$CONNECT_TO" ]; then
          extra+=(--connect-to "$CONNECT_TO")
        fi

        for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
          if curl -sf "${extra[@]}" "$HEALTH_URL"; then
            echo "API ready: $HEALTH_URL"
            exit 0
          fi
          echo "Attempt ${attempt}/${MAX_ATTEMPTS} failed for ${HEALTH_URL}, retrying in ${INTERVAL_SECONDS}s..."
          sleep "$INTERVAL_SECONDS"
        done

        echo "API not ready after ${MAX_ATTEMPTS} attempts: ${HEALTH_URL}"
        exit 1
