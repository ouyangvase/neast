name: Deploy Android (Play Internal)

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to deploy"
        type: choice
        required: true
        default: user
        options:
          - user
          - merchant
          - owner
      commit_sha:
        description: "Optional commit SHA (leave blank for the selected branch)"
        required: false
        default: ""
      submit_only:
        description: "Skip build — submit the latest completed EAS build"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android App (${{ github.event.inputs.app }})
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || github.ref }}

      - uses: ./.github/actions/select-mobile-app
        id: app
        with:
          app: ${{ github.event.inputs.app }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Decode Play service account key
        working-directory: ${{ steps.app.outputs.working_directory }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is empty."
            exit 1
          fi
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json

      - name: EAS Build (Android, production)
        if: ${{ github.event.inputs.submit_only != 'true' }}
        working-directory: ${{ steps.app.outputs.working_directory }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile production --non-interactive

      - name: Submit to Play Internal
        working-directory: ${{ steps.app.outputs.working_directory }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas submit --platform android --profile production --latest --non-interactive
