name: Deploy iOS (TestFlight)

# Manual-only. Private repos on free GitHub plans do not support environment
# protection rules, so this only runs when you click "Run workflow".
on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to deploy"
        type: choice
        required: true
        default: user
        options:
          - user
          - merchant
          - owner
      commit_sha:
        description: "Optional commit SHA (leave blank for the selected branch)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS App (${{ github.event.inputs.app }})
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || github.ref }}

      - uses: ./.github/actions/select-mobile-app
        id: app
        with:
          app: ${{ github.event.inputs.app }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Resolve App Store Connect App ID
        env:
          APP: ${{ github.event.inputs.app }}
          ASC_APP_ID_USER: ${{ secrets.ASC_APP_ID_USER }}
          ASC_APP_ID_MERCHANT: ${{ secrets.ASC_APP_ID_MERCHANT }}
          ASC_APP_ID_OWNER: ${{ secrets.ASC_APP_ID_OWNER }}
        run: |
          case "$APP" in
            merchant) echo "ASC_APP_ID=$ASC_APP_ID_MERCHANT" >> "$GITHUB_ENV" ;;
            owner)    echo "ASC_APP_ID=$ASC_APP_ID_OWNER" >> "$GITHUB_ENV" ;;
            *)        echo "ASC_APP_ID=$ASC_APP_ID_USER" >> "$GITHUB_ENV" ;;
          esac

      - name: Configure EAS Submit credentials
        working-directory: ${{ steps.app.outputs.working_directory }}
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc-key.p8"
          jq --arg appId "$ASC_APP_ID" \
             --arg keyId "$ASC_API_KEY_ID" \
             --arg issuerId "$ASC_API_KEY_ISSUER_ID" \
             --arg keyPath "$RUNNER_TEMP/asc-key.p8" \
            '.submit.production.ios = {ascAppId: $appId, ascApiKeyId: $keyId, ascApiKeyIssuerId: $issuerId, ascApiKeyPath: $keyPath}' \
            eas.json > eas.json.tmp && mv eas.json.tmp eas.json

      - name: EAS Build (iOS, production)
        working-directory: ${{ steps.app.outputs.working_directory }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile production --non-interactive

      - name: Submit to TestFlight
        working-directory: ${{ steps.app.outputs.working_directory }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas submit --platform ios --profile production --latest --non-interactive
