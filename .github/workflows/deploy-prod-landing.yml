name: Deploy Prod Landing

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_REGION: ap-southeast-1
  ENVIRONMENT: prod

jobs:
  changes:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      landing: ${{ steps.flags.outputs.changed }}
      sha: ${{ steps.flags.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/load-ci-change-flags
        id: flags
        with:
          component: landing,cdk
          force: ${{ github.event_name == 'workflow_dispatch' }}
          path_regex: '^(apps/landing/|infra/cdk/)'
          deploy_job: deploy-landing

  verify-api:
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve API health via ALB
        id: api
        run: |
          for attempt in $(seq 1 30); do
            if API_URL=$(aws ssm get-parameter --name /neast/prod/api/url --query Parameter.Value --output text 2>/dev/null) \
              && ALB=$(aws ssm get-parameter --name /neast/prod/alb/dns-name --query Parameter.Value --output text 2>/dev/null); then
              echo "health_url=${API_URL%/}/health" >> "$GITHUB_OUTPUT"
              echo "connect_to=api.neast.my:443:${ALB}:443" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "SSM API params not ready (attempt $attempt/30), retrying in 10s..."
            sleep 10
          done
          echo "Neast-prod-Network is not deployed yet. Run Deploy Prod API first."
          exit 1
      - uses: ./.github/actions/wait-for-api-health
        with:
          url: ${{ steps.api.outputs.health_url }}
          connect_to: ${{ steps.api.outputs.connect_to }}

  deploy-landing:
    needs: [changes, verify-api]
    if: |
      needs.changes.outputs.landing == 'true' &&
      needs.verify-api.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod-landing
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Build and push landing image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: neast-landing-prod
          IMAGE_TAG: ${{ needs.changes.outputs.sha }}
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            -f apps/landing/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push apps/landing

      - name: CDK deploy landing service
        working-directory: infra/cdk
        run: |
          npm ci
          npx cdk deploy Neast-prod-Landing --exclusively \
            --require-approval never \
            -c environment=prod \
            -c deployMode=full \
            -c productionReady=true \
            -c certificateArn=${{ secrets.ACM_CERTIFICATE_ARN }} \
            -c imageTag=${{ needs.changes.outputs.sha }}
