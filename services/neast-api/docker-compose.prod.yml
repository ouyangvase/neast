version: '3'
services:
  hyperf-prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        timezone: PRC
        app_env: prod
    container_name: prod-v2
    restart: always
    volumes:
      - ./app:/opt/www/app
      - ./config:/opt/www/config
      - ./runtime:/opt/www/runtime
      - ./bin:/opt/www/bin
    ports:
      - "9501:9501"
      - "9502:9502"
    environment:
      - APP_ENV=prod
      - APP_URL=
      - TZ=PRC
      - DB_HOST=localhost
      - DB_PORT=3306
      - DB_DATABASE=kjxhs
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_PASSWORD=null
      - REDIS_PREFIX=t_
      - REDIS_DB=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kjds_prod_net
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

networks:
  kjds_prod_net:
    driver: bridge 