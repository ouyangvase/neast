<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>neast Owner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #F2F9FC;
      color: #0F172A;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 420px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero {
      position: relative;
      padding: 48px 24px 56px;
      background: linear-gradient(165deg, #0C1C3E 0%, #0D2567 50%, #0851AA 100%);
      border-radius: 0 0 28px 28px;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -20px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
    }

    .hero::before {
      content: "";
      position: absolute;
      left: -30px;
      bottom: -50px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(96, 191, 0, 0.12);
    }

    .brand {
      position: relative;
      z-index: 1;
      color: #fff;
    }

    .brand-name {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .brand-tagline {
      margin-top: 10px;
      font-size: 15px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.88);
    }

    .content {
      flex: 1;
      padding: 24px 16px 32px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px 16px;
      box-shadow: 0 2px 8px rgba(12, 28, 62, 0.06);
    }

    .card-title {
      font-size: 17px;
      font-weight: 600;
      color: #0851AA;
      text-align: center;
      line-height: 1.4;
    }

    .card-desc {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.5;
      color: rgba(8, 81, 170, 0.65);
      text-align: center;
    }

    .actions {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .store-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .store-btn--apple {
      background: #0C1C3E;
      color: #fff;
    }

    .store-btn--google {
      background: #0851AA;
      color: #fff;
    }

    .store-btn--disabled {
      background: #E8EDF3;
      color: rgba(15, 23, 42, 0.45);
      cursor: not-allowed;
    }

    .store-btn:not(.store-btn--disabled):active {
      opacity: 0.88;
    }

    .hint {
      margin-top: 16px;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
      color: rgba(8, 81, 170, 0.45);
    }

    .accent {
      color: #DF4700;
      font-weight: 600;
    }

    .accent-green {
      color: #60BF00;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="brand">
        <div class="brand-name">neast Owner</div>
        <p class="brand-tagline">Manage properties, track rent, and stay on top of your portfolio.</p>
      </div>
    </header>

    <main class="content">
      <section class="card">
        <h1 class="card-title">Get the neast Owner app</h1>
        <p class="card-desc">Download the neast Owner app for iOS or Android.</p>

        <div class="actions">
          __APP_STORE_BUTTON__
          __GOOGLE_PLAY_BUTTON__
        </div>

        <p class="hint">Available on <span class="accent-green">iOS</span> and <span class="accent">Android</span> soon.</p>
      </section>
    </main>
  </div>
</body>
</html>
