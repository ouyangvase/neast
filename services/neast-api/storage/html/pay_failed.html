<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta charset="utf-8">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			width: 100vw;
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #F6F9F6;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
		}

		.container {
			text-align: center;
			padding: 20px;
		}

		.icon {
			width: 88px;
			height: 88px;
			border-radius: 50%;
			background: linear-gradient(135deg, #E74C3C 0%, #C0392B 100%);
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0 auto 24px;
			box-shadow: 0 8px 24px rgba(231, 76, 60, 0.35);
			color: #fff;
			font-size: 42px;
			line-height: 1;
		}

		h1 {
			color: #0851AA;
			font-size: 22px;
			margin-bottom: 10px;
		}

		p {
			color: #666;
			font-size: 15px;
			line-height: 1.6;
		}
	</style>
	<title>Payment Failed</title>
</head>

<body>
	<div class="container">
		<div class="icon">&times;</div>
		<h1>Payment Failed</h1>
		<p>Your payment could not be completed.<br>Please try again.</p>
	</div>
</body>

</html>
